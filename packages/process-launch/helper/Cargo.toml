[package]
name = "paperclip-scope-exec"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Joins a transient systemd user scope, then executes one target in place"

[[bin]]
name = "paperclip-scope-exec"
path = "src/main.rs"

[dependencies]
libc = "0.2.189"

[profile.release]
# Enrollment runs under catch_unwind so a helper bug still executes the
# target once. Keep unwinding on.
panic = "unwind"
strip = true
