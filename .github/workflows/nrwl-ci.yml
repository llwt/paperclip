name: Nrwl fork CI

# Fork-only workflow (llwt/paperclip). pr.yml calls upstream's reusable
# workflow and is left untouched so it never conflicts with an upstream merge.
# This file is the gate for nrwl-main: see FORK.md.
on:
  pull_request:
    branches:
      - nrwl-main

permissions:
  contents: read

concurrency:
  group: nrwl-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck_build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Together these lanes run the suites of `pnpm test:run` (the general groups
  # plus the serialized server suites), split with the same shard flags
  # upstream's pr-trusted.yml uses. The server shards pick files by path rules
  # (general: server/src/**/*.test.ts minus route/authz names; serialized:
  # route/authz names under server/src/__tests__ only), which leaves out some
  # files the unsharded run includes. The "server other" lane runs exactly the
  # server project test files that no shard selects, computed by
  # scripts/nrwl-ci-server-other.mjs. The server vitest config pins maxWorkers
  # to 1, so one unsplit job would take the sum of all lanes.
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: server 1/5
            script: test:run:general
            args: --group general-server --shard-index 0 --shard-count 5
          - label: server 2/5
            script: test:run:general
            args: --group general-server --shard-index 1 --shard-count 5
          - label: server 3/5
            script: test:run:general
            args: --group general-server --shard-index 2 --shard-count 5
          - label: server 4/5
            script: test:run:general
            args: --group general-server --shard-index 3 --shard-count 5
          - label: server 5/5
            script: test:run:general
            args: --group general-server --shard-index 4 --shard-count 5
          - label: server other
            command: >-
              pnpm run preflight:workspace-links &&
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps &&
              node scripts/nrwl-ci-server-other.mjs
          - label: workspaces-a 1/2
            script: test:run:general
            args: --group general-workspaces-a --shard-index 0 --shard-count 2
          - label: workspaces-a 2/2
            script: test:run:general
            args: --group general-workspaces-a --shard-index 1 --shard-count 2
          - label: workspaces-b
            script: test:run:general
            args: --group general-workspaces-b
          - label: serialized 1/5
            script: test:run:serialized
            args: --shard-index 0 --shard-count 5
          - label: serialized 2/5
            script: test:run:serialized
            args: --shard-index 1 --shard-count 5
          - label: serialized 3/5
            script: test:run:serialized
            args: --shard-index 2 --shard-count 5
          - label: serialized 4/5
            script: test:run:serialized
            args: --shard-index 3 --shard-count 5
          - label: serialized 5/5
            script: test:run:serialized
            args: --shard-index 4 --shard-count 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js for pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: ${{ matrix.command || format('pnpm {0} -- {1}', matrix.script, matrix.args) }}

  # Single check to require on nrwl-main. There is no red test baseline: any
  # failing lane fails the gate.
  gate:
    name: nrwl-ci
    if: ${{ always() }}
    needs: [typecheck_build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail if any lane failed
        env:
          TYPECHECK_BUILD_RESULT: ${{ needs.typecheck_build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TYPECHECK_BUILD_RESULT" = "success"
          test "$TEST_RESULT" = "success"
